[package]
name = "tree-sitter-forge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tree-sitter syntax grammar for Forge editors"
readme = "README.md"
include = ["bindings/rust/*", "grammar.js", "tree-sitter.json", "queries/*", "src/*", "src/tree_sitter/*", "README.md", "LICENSE", "Cargo.toml"]
build = "bindings/rust/build.rs"
[lib]
path = "bindings/rust/lib.rs"
[dependencies]
tree-sitter-language = "0.1.5"
[build-dependencies]
cc = "1"
[dev-dependencies]
tree-sitter = "0.25.10"
forgegraph-syntax = { path = "../crates/forgegraph-syntax", version = "0.3.0" }
