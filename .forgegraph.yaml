app: forge-console
server: https://forgegraf.com
deploymentPlatform: cloudflare-workers
stages:
  - name: production
    url: https://forge.gmac.io
    sortOrder: 20
  # FORG-38 lab (temporary; removed again after the measurement): the deployed run of linkers B and C,
  # the invocation-limit and loader probes and JSPI, research/composable-units/r4-deployed/README.md.
  # sortOrder 90 keeps it above production (20), so it never becomes the auto-deploy stage. ForgeGraph
  # accepts only development/staging/beta/production as stage names; development scopes secrets per
  # developer, so the lab is `staging`. Deploy with `forge deploy create staging --ref FORG-38-paid-measurement`.
  # Every Worker is lab-scoped (forge-lab-*), built by r4-deployed/build.mjs on hetzner-master (it has
  # Rust; forgec is compiled once into a cache outside the clone).
  - name: staging
    sortOrder: 90
    targets:
      - name: rpc-callee
        platform: cloudflare-workers
        nodeId: e147e01c-158c-4162-aeb1-646ab00bda17 # hetzner-master
        config:
          workerName: forge-lab-rpc-callee
          appDir: research/composable-units/r4-deployed
          buildCommand: PATH=$HOME/.cargo/bin:$PATH CARGO_TARGET_DIR=/mnt/master-apps/cache/forg38-lab-cargo node build.mjs rpc-callee
          deployCommand: ../../../packages/linker-dynamic/node_modules/.bin/wrangler deploy --config dist/rpc-callee/wrangler.jsonc
          healthCheckUrl: ""
      - name: c-sweep
        platform: cloudflare-workers
        nodeId: e147e01c-158c-4162-aeb1-646ab00bda17 # hetzner-master
        config:
          workerName: forge-lab-c-sweep
          appDir: research/composable-units/r4-deployed
          buildCommand: PATH=$HOME/.cargo/bin:$PATH CARGO_TARGET_DIR=/mnt/master-apps/cache/forg38-lab-cargo node build.mjs c-sweep
          deployCommand: ../../../packages/linker-dynamic/node_modules/.bin/wrangler deploy --config dist/c-sweep/wrangler.jsonc
