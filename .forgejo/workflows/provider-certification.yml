name: Foundation provider certification

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [provider-certification, provider-full-certification]

concurrency:
  group: foundation-provider-certification
  cancel-in-progress: false

jobs:
  certification:
    # Existing instance-scoped container runner on hetzner-bob.
    runs-on: [forgegraph-ci, heavy]
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: foundation-test-only
          POSTGRES_DB: forge_foundation
        options: >-
          --health-cmd "pg_isready -U forge -d forge_foundation"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      FORGE_FOUNDATION_PG_URL: postgres://forge:foundation-test-only@postgres:5432/forge_foundation
      AWS_REGION: us-east-1
      FORGE_FOUNDATION_DYNAMO_TABLE: forge-foundation-test-20260930
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/pnpm/action-setup@v4
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '24'
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forgegraph/capability-manifest build
      - name: Verify setup tooling
        run: node --test scripts/test/run-foundation-providers.test.mjs scripts/test/foundation-test-infra.test.mjs scripts/test/verify-foundation-providers.test.mjs scripts/test/verify-foundation-certification.test.mjs
      - name: Verify PostgreSQL, hosted D1 and hosted DynamoDB
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FOUNDATION_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FOUNDATION_AWS_SECRET_ACCESS_KEY }}
          FOUNDATION_D1_PROFILES: ${{ secrets.FOUNDATION_D1_PROFILES }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { spawn } from 'node:child_process';
          const profiles = ['core', ...Object.keys(JSON.parse(readFileSync('conformance/foundation/providers/profiles.json', 'utf8')))];
          const deployments = JSON.parse(process.env.FOUNDATION_D1_PROFILES);
          delete process.env.FOUNDATION_D1_PROFILES;
          for (const profile of profiles) {
            const deployment = deployments[profile];
            if (!deployment?.url || !deployment?.token) throw new Error(`Missing D1 deployment for ${profile}`);
          }
          let next = 0;
          let failed = false;
          async function worker() {
            while (!failed && next < profiles.length) {
              const profile = profiles[next++];
              console.log(`Verifying ${profile} across all three providers`);
              const env = { ...process.env, FORGE_FOUNDATION_D1_URL: deployments[profile].url, FORGE_FOUNDATION_D1_TOKEN: deployments[profile].token };
              const passed = await new Promise(resolve => {
                const child = spawn(process.execPath, ['scripts/verify-foundation-providers.mjs', '--provider', 'all', '--profile', profile], { env, stdio: 'inherit' });
                child.on('error', () => resolve(false));
                child.on('close', code => resolve(code === 0));
              });
              if (!passed) failed = true;
            }
          }
          await Promise.all(Array.from({ length: 3 }, () => worker()));
          if (failed) process.exit(1);
          JS
      - name: Validate complete package certification matrix
        run: >-
          node scripts/verify-foundation-certification.mjs
          --receipt-dir conformance/reports/foundation/providers
          --out conformance/reports/foundation/providers/certification.json
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        if: always()
        with:
          name: foundation-provider-certification
          path: conformance/reports/foundation/providers/
          if-no-files-found: warn
