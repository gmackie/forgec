name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# labnuc's act runner provides ubuntu-latest. The console build needs the wasm32 target.
jobs:
  # FORG-35: the whole compiler workspace, as the GitHub `compiler` job ran it before the move to
  # Forgejo (aefd744), plus forgegraph-wasm linted for the target it ships to.
  compiler:
    name: compiler
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Ensure a C toolchain for Rust build scripts
        run: |
          if ! command -v cc >/dev/null 2>&1 && ! command -v gcc >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates
          fi
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint forgegraph-wasm for wasm32-unknown-unknown
        run: cargo clippy -p forgegraph-wasm --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo test --workspace --locked

  # FORG-35: composable units (FORG-28..31) and the full runtime suite.
  # - The unit and linker tests run the real debug `forgec` (target/debug/forgec) and local workerd
  #   (Miniflare for linker-packed, `wrangler dev --local` for linker-dynamic). workerd comes from
  #   the @cloudflare/workerd-linux-* optional dependency, so it needs no install step.
  # - wasm.test.ts runs the committed impl/quote-order.wasm, and also rebuilds it byte for byte when
  #   rustc 1.97.1 (wasm32) and wasm-tools 1.262.0 are present, skipping that check otherwise. The
  #   toolchain is installed and asserted below so the reproduction check cannot skip in CI.
  # - linker-packed's differential.test.ts (6 tests) stays opt-in (T3_DIFFERENTIAL=1, after
  #   research/composable-units/t3-linker-packed/run.sh), as documented in that test.
  units:
    name: composable units and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      WASM_TOOLS_VERSION: "1.262.0"
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Ensure a C toolchain for Rust build scripts
        run: |
          if ! command -v cc >/dev/null 2>&1 && ! command -v gcc >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates
          fi
      - uses: https://github.com/pnpm/action-setup@v4
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: "24"
      # Matches examples/pricing/impl/quote-order-rs/rust-toolchain.toml.
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Install wasm-tools (pinned by examples/pricing/build-component.mjs)
        run: |
          case "$(uname -m)" in
            x86_64) arch=x86_64; sha=655b8df67d54c3ef9b52fc237c4e94bbfbb5f5f43825245cb0940a7002a9ed65 ;;
            aarch64) arch=aarch64; sha=729dc47a114305ed60873ce6199d403eed1da89c3aa2367eef292da358b1e8d3 ;;
            *) echo "::error::no wasm-tools build for $(uname -m)"; exit 1 ;;
          esac
          name="wasm-tools-${WASM_TOOLS_VERSION}-${arch}-linux"
          curl -fsSL -o /tmp/wasm-tools.tar.gz "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/${name}.tar.gz"
          echo "${sha}  /tmp/wasm-tools.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wasm-tools.tar.gz -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "/tmp/${name}/wasm-tools" "$HOME/.local/bin/wasm-tools"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Require the component toolchain so the reproduction test runs
        run: |
          wasm-tools --version | grep -F "$WASM_TOOLS_VERSION"
          (cd examples/pricing/impl/quote-order-rs && rustc --version | grep -F 1.97.1)
      - name: Build the debug forgec the tests drive
        run: cargo build --locked -p forgegraph-cli
      - run: pnpm install --frozen-lockfile
      - name: Build the packages the unit packages import (runtime, capability-manifest)
        run: pnpm --filter '@forgegraph/units^...' --filter '@forgegraph/linker-packed^...' --filter '@forgegraph/linker-dynamic^...' run build
      - name: Typecheck the unit packages
        run: pnpm --filter @forgegraph/units --filter @forgegraph/linker-packed --filter @forgegraph/linker-dynamic run typecheck
      # One package per step: the linker tests both build examples/acme/generated and start workerd.
      - run: pnpm --filter @forgegraph/units test
      - run: pnpm --filter @forgegraph/linker-packed test
      - run: pnpm --filter @forgegraph/linker-dynamic test
      # The whole runtime suite. Its config defaults testTimeout to 5 s, and six suites
      # (artifact-workspace-workers-incremental, foundation-subscription,
      # foundation-collections-dunning, foundation-asset-lifecycle, foundation-billing,
      # foundation-scheduling) exceed that even on a fast Mac. CI raises the per-test budget to
      # 60 s instead of skipping them. Provider-gated suites (FORGE_PG_URL, FORGE_FOUNDATION_PG_URL,
      # AWS_REGION, FORGE_DYNAMO_*, FORGE_D1_HARNESS) skip here: they run in
      # provider-certification.yml. The MQTT live suites run in the console job with Mosquitto.
      - name: Run the full runtime suite with a CI test timeout
        run: pnpm --filter @forgegraph/runtime exec vitest run --testTimeout=60000

  console:
    name: console
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Ensure a C toolchain for Rust build scripts
        run: |
          if ! command -v cc >/dev/null 2>&1 && ! command -v gcc >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates
          fi
      - uses: https://github.com/pnpm/action-setup@v4
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: "24"
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: wasm32-unknown-unknown
      - name: Verify SDK ownership and release tooling
        run: |
          node scripts/check-package-identities.mjs
          node --test scripts/test/check-package-identities.test.mjs scripts/test/check-workflows.test.mjs
      - name: Compile the README tour and exercise documented CLI commands
        run: cargo test --locked -p forgegraph-cli --test cli
      - name: Verify typed MQTT compiler and planner contracts
        run: |
          cargo test --locked -p forgegraph-semantic --test mqtt
          cargo test --locked -p forgegraph-planner --test mqtt
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forgegraph/console... build
      - name: Install Mosquitto for the real MQTT broker roundtrip
        run: |
          apt-get update
          apt-get install -y --no-install-recommends mosquitto mosquitto-clients
      - name: Verify the runtime HTTP and signed webhook boundaries
        run: |
          pnpm --filter @forgegraph/runtime typecheck
          pnpm --filter @forgegraph/runtime build
          FORGE_MQTT_TEST=1 pnpm --filter @forgegraph/runtime exec vitest run test/workspace-auth.test.ts test/http.test.ts test/http-streaming.test.ts test/aws-host.test.ts test/webhooks.test.ts test/realtime.test.ts test/realtime-node.test.ts test/mqtt.test.ts test/mqtt-consumer.test.ts test/mqtt-node-consumer.test.ts test/mqtt-live.test.ts test/dispatch.test.ts
      - name: Verify portable Git object and pack preparation
        run: |
          pnpm --filter @forgegraph/runtime exec vitest run test/artifact-workspace-workers.test.ts test/artifact-workspace-workers-incremental.test.ts test/artifact-workspace.test.ts test/artifact-publication-workers.test.ts test/artifact-publication.test.ts
          node scripts/qualify-worker-artifact-preparation.mjs
      - name: Verify transaction composition and guarded rollback
        run: pnpm --filter @forgegraph/runtime exec vitest run test/dynamodb-atomic-composition.test.ts test/function-transactions.test.ts test/transaction-view.test.ts test/foundation-atomicity.test.ts test/functions.test.ts test/foundation-authorized-atomic.test.ts test/atomic-absence-guards.test.ts
      - name: Verify deployment plans and Cloudflare Tunnel projections
        run: |
          pnpm --filter @forgegraph/adapters typecheck
          pnpm --filter @forgegraph/adapters build
          pnpm --filter @forgegraph/adapters exec vitest run test/deployment.test.ts test/tunnels.test.ts test/tunnel-executor.test.ts test/mqtt-broker.test.ts
      - run: pnpm --filter @forgegraph/console typecheck
      - run: pnpm --filter @forgegraph/console test

  # The browser suite against a real OCI registry, as on GitHub. Pushes to Forgejo main
  # deploy production, so a Forgejo merge must pass it too.
  acceptance:
    name: console acceptance
    runs-on: [forgegraph-ci, heavy]
    timeout-minutes: 45
    services:
      registry:
        image: registry:3
        env:
          OTEL_TRACES_EXPORTER: none
          OTEL_METRICS_EXPORTER: none
          OTEL_LOGS_EXPORTER: none
    env:
      CARGO_BUILD_JOBS: "2"
      OCI_TEST_URL: http://registry:5000
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Ensure a C toolchain for Rust build scripts
        run: |
          if ! command -v cc >/dev/null 2>&1 && ! command -v gcc >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates
          fi
      - uses: https://github.com/pnpm/action-setup@v4
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: "24"
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forgegraph/console... build
      - run: pnpm --filter @forgegraph/console test
      - name: Qualify OCI publication with a slow real registry response
        run: OCI_TEST_DELAY_MS=6000 pnpm --filter @forgegraph/console exec vitest run test/oci-live.test.ts
      - run: pnpm --filter @forgegraph/console exec playwright install --with-deps chromium
      - name: Exercise the console against a real OCI registry
        working-directory: packages/console
        run: |
          node scripts/local-test-server.mjs > /tmp/forge-console.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/healthz; then break; fi
            sleep 1
          done
          pnpm exec playwright test || {
            tail -50 /tmp/forge-console.log
            find test-results -name error-context.md -exec cat {} \;
            exit 1
          }

  # ForgeGraph's deploy gate waits for this report; without it every deploy needs --break-glass.
  report:
    name: report to ForgeGraph
    # Every job listed here gates the deploy: the report is success only when all succeed.
    needs: [compiler, units, console, acceptance]
    if: always()
    runs-on: ubuntu-latest
    # Report needs only shell/curl, not a host-local forgegraph-act image.
    container:
      image: node:24.14.0
    steps:
      - name: Report CI result to ForgeGraph
        env:
          FG_CI_TOKEN: ${{ secrets.FORGEGRAPH_TOKEN }}
          COMPILER: ${{ needs.compiler.result }}
          UNITS: ${{ needs.units.result }}
          CONSOLE: ${{ needs.console.result }}
          ACCEPTANCE: ${{ needs.acceptance.result }}
          # Untrusted (a PR branch name is chosen by its author): only ever read from the
          # environment and serialised by node, never expanded into the script (FORG-39).
          BRANCH: ${{ github.head_ref || github.ref_name }}
          REPO_FULL: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "${FG_CI_TOKEN:-}" ]; then
            echo "::warning::FORGEGRAPH_TOKEN is not set; run forge ci provision"
            exit 0
          fi
          RESULTS="$COMPILER $UNITS $CONSOLE $ACCEPTANCE"
          echo "compiler=$COMPILER units=$UNITS console=$CONSOLE acceptance=$ACCEPTANCE"
          case " $RESULTS " in
            *" cancelled "*) ANY_CANCELLED=1 ;;
            *) ANY_CANCELLED=0 ;;
          esac
          if [ "$RESULTS" = "success success success success" ]; then STATUS=success
          elif [ "$ANY_CANCELLED" = 1 ]; then STATUS=cancelled
          else STATUS=failure; fi
          export STATUS
          BODY="$(node -e '
            const e = process.env;
            const [owner, ...rest] = e.REPO_FULL.split("/");
            process.stdout.write(JSON.stringify({
              owner, repo: rest.join("/"), sha: e.SHA, branch: e.BRANCH, status: e.STATUS, runId: e.RUN_ID,
              runUrl: `${e.SERVER_URL}/${e.REPO_FULL}/actions/runs/${e.RUN_ID}`, workflowName: "CI",
            }));
          ')"
          curl -sf -X POST "https://forgegraf.com/api/fg/ci/report" \
            -H "Authorization: Bearer ${FG_CI_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "$BODY" || echo "::warning::Failed to report CI result to ForgeGraph"
