name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# labnuc's act runner provides ubuntu-latest. The console build needs the wasm32 target.
jobs:
  console:
    name: console
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Ensure a C toolchain for Rust build scripts
        run: |
          if ! command -v cc >/dev/null 2>&1 && ! command -v gcc >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates
          fi
      - uses: https://github.com/pnpm/action-setup@v4
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '24'
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          targets: wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forgegraph/console... build
      - run: pnpm --filter @forgegraph/console typecheck
      - run: pnpm --filter @forgegraph/console test

  # The browser suite against a real OCI registry, as on GitHub. Pushes to Forgejo main
  # deploy production, so a Forgejo merge must pass it too.
  acceptance:
    name: console acceptance
    runs-on: [forgegraph-ci, heavy]
    timeout-minutes: 45
    services:
      registry:
        image: registry:3
        env:
          OTEL_TRACES_EXPORTER: none
          OTEL_METRICS_EXPORTER: none
          OTEL_LOGS_EXPORTER: none
    env:
      CARGO_BUILD_JOBS: '2'
      OCI_TEST_URL: http://registry:5000
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Ensure a C toolchain for Rust build scripts
        run: |
          if ! command -v cc >/dev/null 2>&1 && ! command -v gcc >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates
          fi
      - uses: https://github.com/pnpm/action-setup@v4
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '24'
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          targets: wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forgegraph/console... build
      - run: pnpm --filter @forgegraph/console test
      - run: pnpm --filter @forgegraph/console exec playwright install --with-deps chromium
      - name: Exercise the console against a real OCI registry
        working-directory: packages/console
        run: |
          node scripts/local-test-server.mjs > /tmp/forge-console.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/healthz; then break; fi
            sleep 1
          done
          pnpm exec playwright test || { tail -50 /tmp/forge-console.log; exit 1; }

  # ForgeGraph's deploy gate waits for this report; without it every deploy needs --break-glass.
  report:
    name: report to ForgeGraph
    needs: [console, acceptance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report CI result to ForgeGraph
        env:
          FG_CI_TOKEN: ${{ secrets.FORGEGRAPH_TOKEN }}
          CONSOLE: ${{ needs.console.result }}
          ACCEPTANCE: ${{ needs.acceptance.result }}
        run: |
          if [ -z "${FG_CI_TOKEN:-}" ]; then
            echo "::warning::FORGEGRAPH_TOKEN is not set; run forge ci provision"
            exit 0
          fi
          if [ "$CONSOLE" = success ] && [ "$ACCEPTANCE" = success ]; then STATUS=success
          elif [ "$CONSOLE" = cancelled ] || [ "$ACCEPTANCE" = cancelled ]; then STATUS=cancelled
          else STATUS=failure; fi
          REPO_FULL="${{ github.repository }}"
          curl -sf -X POST "https://forgegraf.com/api/fg/ci/report" \
            -H "Authorization: Bearer ${FG_CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"owner\": \"${REPO_FULL%%/*}\",
              \"repo\": \"${REPO_FULL##*/}\",
              \"sha\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.head_ref || github.ref_name }}\",
              \"status\": \"${STATUS}\",
              \"runId\": \"${{ github.run_id }}\",
              \"runUrl\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"workflowName\": \"CI\"
            }" || echo "::warning::Failed to report CI result to ForgeGraph"
