[package]
name = "forge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Forge compiler command line"

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
forge-syntax = { path = "../forge-syntax" }
forge-semantic = { path = "../forge-semantic" }
forge-planner = { path = "../forge-planner" }
forge-codegen = { path = "../forge-codegen" }
clap.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
anyhow.workspace = true
sha2.workspace = true
hex.workspace = true
