name: Mirror to Forgejo

# Replays GitHub main onto git.forgegraf.com. Pushes to Forgejo main
# deploy forge.gmac.io, and PRs are also merged on Forgejo, so this never forces: if
# Forgejo main has commits GitHub lacks, the push is rejected and the job fails rather
# than erasing them. Merge Forgejo main into GitHub, then re-run this workflow.
#
# Tags are not mirrored: ForgeGraph deploys any pushed ref, so mirroring v0.4.0 on
# 2026-10-05 rolled production back to that release. Releases are published from GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    # No repository-name guard: a fork simply has no FORGEJO_TOKEN and the step
    # below skips. Gating on the name means the guard rots every time the
    # canonical repository moves, which is exactly when mirroring matters.
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: push to the mirror
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FORGEJO_TOKEN:-}" ]; then
            echo "::warning::FORGEJO_TOKEN is not set; skipping the mirror"
            exit 0
          fi
          remote="https://x-access-token:${FORGEJO_TOKEN}@git.forgegraf.com/gmackie/forge.git"
          if ! git push "$remote" "HEAD:refs/heads/main"; then
            echo "::error::Forgejo main has commits that GitHub main lacks. Merge them into GitHub, then re-run this workflow."
            exit 1
          fi
