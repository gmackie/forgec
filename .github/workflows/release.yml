name: Release

# Tag a release with `v<version>` (matching the workspace version) and push the tag.
# Everything below is idempotent per version: re-running a failed job will not double-publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: forge, POSTGRES_PASSWORD: forge, POSTGRES_DB: forge_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FORGE_PG_URL: postgres://forge:forge@localhost:5432/forge_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: "24.x", cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - id: v
        name: the tag, the crates and every package must agree on one version
        # On a tag, everything must match the tag. On a manual rehearsal GITHUB_REF_NAME is a
        # branch, so pass nothing and let the script check the workspace agrees with itself.
        run: node scripts/check-release-version.mjs "${TAG}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
      - run: PGPASSWORD=forge psql -h localhost -U forge -d postgres -c "CREATE DATABASE forge_node" -c "CREATE DATABASE forge_temporal"
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace --locked
      - run: pnpm -r run build
      - run: pnpm -r test
      - run: node scripts/check-packaging.mjs
      # crates.io names are permanent and publishing is ordered: a taken name discovered
      # mid-publish leaves the crates before it up, forever. Ask before starting.
      - run: node scripts/check-crate-names.mjs

  binaries:
    name: forgec ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,    target: aarch64-apple-darwin }
          - { os: macos-latest,    target: x86_64-apple-darwin }
          - { os: ubuntu-latest,   target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - run: cargo build --release --locked -p forgegraph-cli --target ${{ matrix.target }}
      - name: package
        run: |
          set -euo pipefail
          name="forgec-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/forgec" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz" | awk '{print $1}' > "dist/$name.tar.gz.sha256"
          cat "dist/$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: forgec-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  github-release:
    name: github release
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outcome }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { path: dist, pattern: "forgec-*", merge-multiple: true }
      - name: release notes from the changelog
        run: node scripts/release-notes.mjs "${{ needs.verify.outputs.version }}" > RELEASE_NOTES.md
      - id: publish
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
            RELEASE_MANIFEST.json
          fail_on_unmatched_files: true

  npm:
    name: npm (with provenance)
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: "24.x", cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      # publishConfig.provenance is set per package; pnpm publishes in topological order and
      # rewrites `workspace:*` to the exact version. Already-published versions are skipped.
      - run: pnpm -r publish --access public --no-git-checks ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  crates:
    name: crates.io
    # Deliberately after npm, not beside it. A crates.io publish is permanent — a name cannot be
    # freed or reassigned, only yanked — while an npm publish can be re-run and, in the worst
    # case, unpublished. So the reversible half of the release proves itself first; anything that
    # goes wrong (registry outage, a provenance rejection, a bad scope) then costs nothing
    # instead of burning five crate names forever.
    needs: [verify, github-release, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      # dependency order; each publish waits for the index before the next crate needs it
      - name: publish crates
        run: node scripts/publish-crates.mjs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ env.DRY_RUN }}

  # The Homebrew formula is not pushed from here. gmackorg/homebrew-tap pulls it from this
  # release on its own schedule (and on demand), using its own token — so this project holds no
  # credential for that repository. See docs/releasing.md.
