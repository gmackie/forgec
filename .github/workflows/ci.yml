name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  compiler:
    name: compiler (rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.97"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: python3 examples/concept-boundary/generate_pressure_matrix.py --check
      - run: python3 examples/concept-boundary/digital-twin/specialized-model/check_interface.py

  editor-grammar:
    name: Tree-sitter generation and Rowan drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24.x" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install tree-sitter-cli --version 0.25.10 --locked
      - run: tree-sitter generate
        working-directory: tree-sitter-forge
      - run: git diff --exit-code -- tree-sitter-forge/src
      - run: cargo test -p tree-sitter-forge --locked

  runtime:
    name: runtime + packages (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FORGE_PG_URL: postgres://forge:forge@localhost:5432/forge_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # the Node-host and cutover suites need a second database on the same server
      - run: PGPASSWORD=forge psql -h localhost -U forge -d postgres -c "CREATE DATABASE forge_node" -c "CREATE DATABASE forge_temporal"
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/test/verify-foundation.test.mjs
      - run: node scripts/verify-foundation.mjs --suite contracts --all
      # generated fixtures must match what the compiler emits from the sources in this commit
      - run: ./scripts/refresh-fixtures.sh
      - run: git diff --exit-code -- conformance/fixtures conformance/foundation/composition.app.json examples/acme/generated || (echo "::error::generated fixtures are stale; run ./scripts/refresh-fixtures.sh" && exit 1)
      - run: pnpm -r run build
      - run: pnpm -r typecheck
      - run: pnpm -r test

  console:
    name: console OCI + browser acceptance
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3
        env:
          OTEL_TRACES_EXPORTER: none
          OTEL_METRICS_EXPORTER: none
          OTEL_LOGS_EXPORTER: none
        ports: ["15000:5000"]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: "24.x", cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forgegraph/console... build
      - run: pnpm --filter @forgegraph/console typecheck
      - run: pnpm --filter @forgegraph/console test
        env:
          OCI_TEST_URL: http://127.0.0.1:15000
      - run: pnpm --filter @forgegraph/console exec playwright install --with-deps chromium
      - name: Exercise the console against a real OCI registry
        working-directory: packages/console
        run: |
          node scripts/local-test-server.mjs > /tmp/forge-console.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/healthz; then break; fi
            sleep 1
          done
          pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-acceptance
          path: |
            /tmp/forge-console*.png
            /tmp/forge-console.log
            packages/console/test-results

  differential:
    name: cross-profile differential
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FORGE_PG_URL: postgres://forge:forge@localhost:5432/forge_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: "24.x", cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      - run: pnpm --filter @forgegraph/conformance differential
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: differential-report
          path: conformance/reports/differential.json

  workflows:
    name: workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: "24.x", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # an unparseable workflow fails as a run named after the file, with no log
      - run: node scripts/check-workflows.mjs

  packaging:
    name: packaging dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: "24.x", cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      # every publishable package must produce a tarball that carries its built output
      - run: node scripts/check-packaging.mjs
      # and every crate name must still be ours to publish under
      - run: node scripts/check-crate-names.mjs
      - run: cargo publish --dry-run -p forgegraph-syntax --locked
      - run: cargo package --workspace --locked --allow-dirty

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: "24.x", cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high || echo "::warning::pnpm audit reported advisories"
      - uses: rustsec/audit-check@v2
        with: { token: "${{ secrets.GITHUB_TOKEN }}" }
