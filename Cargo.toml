[workspace]
resolver = "3"
members = ["crates/forgegraph-syntax", "crates/forgegraph-semantic", "crates/forgegraph-planner", "crates/forgegraph-codegen", "crates/forgegraph-cli", "crates/forgegraph-editor", "tree-sitter-forge"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"
authors = ["ForgeGraph contributors"]
repository = "https://github.com/gmackie/forgec"
homepage = "https://forgegraf.com"
documentation = "https://docs.rs/forgegraph-cli"
readme = "README.md"
keywords = ["compiler", "codegen", "serverless", "cloudflare", "aws"]
categories = ["development-tools", "compilers", "web-programming"]

[workspace.dependencies]
logos = "0.16"
rowan = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
clap = { version = "4", features = ["derive"] }
insta = { version = "1", features = ["json"] }
anyhow = "1"
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
