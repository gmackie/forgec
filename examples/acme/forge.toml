[package]
name = "@acme/commerce"
version = "0.1.0"
edition = "2026"

[source]
root = "src"
entry = "src/index.forge"

[dependencies]
payments = { path = "../payments" }

[compatibility]
profile = "portable-v1"
targets = ["cloudflare-d1", "aws-dynamodb"]

[observability]
window = "28d"

[observability.slo.crud-read]
availability = "99.9%"
latency = { good = "99%", within = "500ms" }

[observability.slo.crud-write]
availability = "99.9%"
latency = { good = "99%", within = "1s" }

# Pinned adapter capability manifests (plan §3.3): validated by digest and shape, never executed.
[extensions.cloudflare-d1]
manifest = "../../packages/contracts/capability-manifest/manifests/d1.json"
sha256 = "11afe6a3b0244b404b5df5c0dc6d2911084d1ab2532e249acf0db55c9219b199"

[extensions.aws-dynamodb]
manifest = "../../packages/contracts/capability-manifest/manifests/dynamodb.json"
sha256 = "5ea4de414f5e2d145d1ff1ab0050fc727347023b00116340ecbe1bdf06a02db7"
